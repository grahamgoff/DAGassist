url: https://grahamgoff.com/DAGassist/
    
template:
  bootstrap: 5
  light-switch: true
  theme: arrow-light
  theme-dark: arrow-dark
  bslib:
    primary: "#AC4848"
    body-color: "#2B2424"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: "1.05rem"
  opengraph:
    image:
      src: man/figures/card.png
      alt: "DAGassist: Align Regressions with Target Estimands"

figures:
  dev: ragg::agg_png
  dpi: 150
  fig.width: 7.2
  fig.retina: 2
  bg: "#FFFFFF"
  
navbar:
  bg: primary
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Supported model engines
        href: articles/compatibility.html

home:
  title: "DAGassist: Align Regressions with Target Estimands"
  description: >
    Classify covariates by causal role, re-estimate models with DAG-derived
    adjustment sets, and export publication-grade robustness reports.
  sidebar:
    structure: [links, citation, authors, license, dev]

authors:
  Graham Goff:
    href: https://grahamgoff.com
  Michael Denly:
    href: https://www.mikedenly.com

reference:
  - title: "Main function"
    desc: >
      One call validates the DAG, classifies roles, fits comparison models,
      and renders the report.
    contents:
      - DAGassist

  - title: "Robustness to DAG uncertainty"
    desc: >
      Check whether conclusions survive uncertain edge directions or
      plausibly missing arrows.
    contents:
      - pdag_robustness
      - add_edges_robustness

  - title: "Diagnostics and building blocks"
    desc: >
      Standalone helpers used inside DAGassist() that are also useful on their own.
    contents:
      - classify_nodes
      - bad_controls_in
      - balance_models

  - title: "Print methods"
    desc: >
      Console printers for DAGassist objects. You rarely call these directly.
    contents:
      - starts_with("print.")